about:
  lengths:
    short: Short
    medium: Medium
    long: Long
  # Each description is its own part and all parts before it.
  parts:
    short: Project AIRI is an open-source attempt to re-create Neuro-sama, the AI VTuber, and a cyber companion for everyone.
    medium: AIRI is a soul container of AI waifu and virtual characters. It can chat, listen, and speak, and it can play games such as Minecraft and Factorio. AIRI runs in modern browsers, on desktop computers, and on mobile devices.
    long: AIRI uses Web technologies such as WebGPU, WebAudio, WebAssembly, and WebSocket from the first day. The desktop version can use NVIDIA CUDA and Apple Metal for local inference. Characters can use VRM and Live2D models, and AIRI can chat in Telegram and Discord. Voice synthesis supports several providers, such as ElevenLabs, Microsoft Azure Speech, OpenAI-compatible services, and local Kokoro TTS. The project is open source under the MIT License. Its goal is to let everyone own a digital life, easily, anywhere, and at any time.
